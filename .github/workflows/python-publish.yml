# Builds the sdist/wheel from the commit the release tag points to and uploads
# it to PyPI via Trusted Publishing (OIDC), with PEP 740 attestations.
#
# Supply-chain hardening (LAM-2384):
# - the build checks out this repository at github.sha only, and fails unless
#   that commit is what the release tag points to and is already on main;
# - building and publishing are split, so build-time code never sees the OIDC
#   token that can upload to PyPI;
# - after the upload, the attestations PyPI serves are verified against this
#   repository and the exact files built here;
# - third-party actions are pinned to commit SHAs, or to an immutable release
#   tag where the action publishes immutable releases.
#
# The verification steps live inline on purpose: a local composite action
# would be loaded from the checked-out tree, i.e. from the code being verified.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'lmnr-ai/lmnr-python'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          # full history + tags, to check the tag and main below
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          origin="$(git remote get-url origin)"
          [ "${origin%.git}" = "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" ] \
            || fail "origin remote is not $GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          [ "$GITHUB_REF" = "refs/tags/$RELEASE_TAG" ] \
            || fail "GITHUB_REF $GITHUB_REF is not the release tag $RELEASE_TAG"
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] \
            || fail "HEAD $(git rev-parse HEAD) is not GITHUB_SHA $GITHUB_SHA"
          tag_sha="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          [ "$tag_sha" = "$GITHUB_SHA" ] \
            || fail "tag $RELEASE_TAG points to $tag_sha, not GITHUB_SHA $GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || fail "$GITHUB_SHA is not on main"

          # Tags are <version> or <version>.postN / <version>-post.N re-releases.
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          [ "${RELEASE_TAG%%[.-]post*}" = "$version" ] \
            || fail "tag $RELEASE_TAG does not match pyproject.toml version $version"

          echo "Building $GITHUB_REPOSITORY@$GITHUB_SHA ($RELEASE_TAG, version $version)"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install build==1.6.1
      - name: Build package
        run: python -m build
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    # amd64-only: pypa/gh-action-pypi-publish has no arm64 image
    # https://github.com/pypa/gh-action-pypi-publish/issues/356
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/lmnr/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true

  verify-attestations:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Install uv
        # an immutable release tag: GitHub refuses to move it
        uses: astral-sh/setup-uv@v10.3.0
      - name: Verify PyPI attestations
        # Checks the Sigstore signature, that the publisher identity is this
        # repository, and that the attested digest is the file built above.
        run: |
          set -euo pipefail
          for file in dist/*; do
            for attempt in $(seq 1 10); do
              if uvx --from pypi-attestations==0.0.30 pypi-attestations verify pypi \
                  --repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$file"; then
                continue 2
              fi
              echo "Attempt $attempt failed, retrying in 15s"
              sleep 15
            done
            echo "::error::Could not verify the PyPI attestation for $file"
            exit 1
          done
