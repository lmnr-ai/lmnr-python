name: Scheduled Tests

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v 7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0 # immutable tag
        with:
          activate-environment: true
          python-version: ${{ matrix.python-version }}
      - name: Install the project
        run: uv sync --all-extras --dev
      - name: Run tests
        run: uv run pytest

      # openai>=3 isn't installable alongside the dev deps (litellm caps openai<3),
      # so the Decisions API tests run against an overlay of the newer SDK.
      - name: Run Decisions API tests (openai 3.x)
        run: uv run --with openai==3.26.0 pytest tests/test_instrumentations/test_openai/traces/test_decisions.py

  notify:
    runs-on: ubuntu-24.04-arm
    needs: test
    if: always() && needs.test.result == 'failure'
    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@v4.0.0 # immutable tag
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":red_circle: Scheduled tests failed on `${{ github.ref_name }}`",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":red_circle: *Scheduled tests failed*\n*Branch:* `${{ github.ref_name }}`\n*Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"
                  }
                }
              ]
            }
