name: Run Tests

on:
  pull_request:
    types: [opened, synchronize]
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v 7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0 # immutable tag
        with:
          activate-environment: true
          python-version: ${{ matrix.python-version }}
      - name: Install the project
        run: uv sync --all-extras --dev
      - name: Run tests
        run: uv run pytest

      # openai>=3 isn't installable alongside the dev deps (litellm caps openai<3),
      # so the Decisions API tests run against an overlay of the newer SDK.
      - name: Run Decisions API tests (openai 3.x)
        run: uv run --with openai==3.26.0 pytest tests/test_instrumentations/test_openai/traces/test_decisions.py

      # The dev dependency pins mcp 2.x, so the 1.x instrumentation (a separate
      # set of wrappers, see instrumentation/mcp/AGENTS.md) runs against an overlay.
      - name: Run MCP tests (mcp 1.x)
        run: uv run --with mcp==1.30.0 pytest tests/test_instrumentations/test_mcp tests/test_instrumentor_targets.py -k mcp

      # The Langfuse bridge supports the current langfuse major and the two
      # before it. The dev dependency pins 4.x because langfuse 5.x needs
      # opentelemetry-sdk >= 1.45, which the pinned google-adk excludes; 5.x
      # and 3.x run against overlays (5.x also needs the matching exporters).
      - name: Run Langfuse bridge tests (langfuse 5.x)
        run: uv run --with langfuse==5.2.0 --with opentelemetry-exporter-otlp-proto-grpc==1.45.1 --with opentelemetry-exporter-otlp-proto-http==1.45.1 pytest tests/test_langfuse
      - name: Run Langfuse bridge tests (langfuse 3.x)
        run: uv run --with langfuse==3.15.0 pytest tests/test_langfuse
