name: Run Tests

on:
  pull_request:
    types: [opened, synchronize]
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v 7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0 # immutable tag
        with:
          activate-environment: true
          python-version: ${{ matrix.python-version }}
      - name: Install the project
        run: uv sync --all-extras --dev
      - name: Run tests
        run: uv run pytest

      # The dev dependency pins mcp 2.x, so the 1.x instrumentation (a separate
      # set of wrappers, see instrumentation/mcp/AGENTS.md) runs against an overlay.
      - name: Run MCP tests (mcp 1.x)
        run: uv run --with mcp==1.30.0 pytest tests/test_instrumentations/test_mcp tests/test_instrumentor_targets.py -k mcp

      # The Langfuse bridge supports the current langfuse major and the two
      # before it. The dev dependency pins 5.x; 4.x and 3.x run against overlays.
      - name: Run Langfuse bridge tests (langfuse 4.x)
        run: uv run --with langfuse==4.15.0 pytest tests/test_langfuse
      - name: Run Langfuse bridge tests (langfuse 3.x)
        run: uv run --with langfuse==3.15.0 pytest tests/test_langfuse
