name: Run Tests

on:
  pull_request:
    types: [opened, synchronize]
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          activate-environment: true
      - name: Install the project
        run: uv sync --all-extras --dev
      - name: Run tests
        run: uv run pytest

      # openai>=3 isn't installable alongside the dev deps (litellm caps openai<3),
      # so the Decisions API tests run against an overlay of the newer SDK.
      - name: Run Decisions API tests (openai 3.x)
        run: uv run --with openai==3.26.0 pytest tests/test_instrumentations/test_openai/traces/test_decisions.py

      # The dev pin stays on an older google-adk; 2.9 and 2.10 moved the
      # by-name bindings the instrumentor patches, so also run the ADK tests
      # against a current release.
      - name: Run Google ADK tests (google-adk 2.11)
        run: uv run --with google-adk==2.11.0 pytest tests/test_google_adk.py
