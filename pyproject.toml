# Laminar Python

# If you are looking for information about possible extras installations,
# i.e. what you can pass into `pip install 'lmnr[extra1,extra2]'`, please see the
# `[project.optional-dependencies]` section below.

[project]
name = "lmnr"
version = "0.8.3"
description = "Python SDK for Laminar"
authors = [
  { name = "lmnr.ai", email = "founders@lmnr.ai" }
]
readme = "README.md"
requires-python = ">=3.11,<4"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  # grpcio used to have some issues with improper shutdown.
  # Fixed in opentelemetry-exporter-otlp-proto-grpc >=1.31.0.
  # Fixed in grpc >= 1.80.0. Remaining related issue to track
  # https://github.com/grpc/grpc/issues/41672
  "blake3 (>=1.0.0,<2.0.0)",
  "grpcio>=1",
  "httpx (>=0.24.0,<1.0.0)",
  "lmnr-claude-code-proxy>=0.2.0",
  "opentelemetry-api (>=1.39.0, <2.0.0)",
  "opentelemetry-sdk (>=1.39.0, <2.0.0)",
  "opentelemetry-exporter-otlp-proto-http (>=1.39.0, <2.0.0)",
  "opentelemetry-exporter-otlp-proto-grpc (>=1.39.0, <2.0.0)",
  "opentelemetry-instrumentation (>=0.54b0, <1.0.0)",
  "opentelemetry-instrumentation-threading (>=0.54b0, <1.0.0)",
  "opentelemetry-semantic-conventions (>=0.62b1, <1.0.0)",
  "opentelemetry-semantic-conventions-ai (==0.5.1)",
  "orjson (>=3.0.0,<4.0.0)",
  "packaging (>=22.0,<27.0)",
  "pydantic (>=2.0.3,<3.0.0)",
  "python-dotenv (>=1.0,<2.0)",
  "tqdm (>=4.0,<5.0)",
  "tenacity (>=8.0,<10.0)",
  "wrapt (>=1.14,<3.0.0)",
]
# poetry would auto-generate these based on requires-python, but other build
# systems don't, so we need to specify them manually.
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.scripts]
lmnr = "lmnr.cli:cli"

[project.entry-points."harbor.plugins"]
laminar = "lmnr.integrations.harbor:LaminarPlugin"

[project.optional-dependencies]
# List of all possible extras. You can specify one or more of these extras
# when installing the package, using any of the following examples:
# `pip install 'lmnr[bedrock,langchain]'`
# `uv pip install 'lmnr[bedrock,langchain]'`
# `uv add lmnr --extra bedrock --extra langchain`
# `poetry add 'lmnr[bedrock,langchain]'`

alephalpha=["opentelemetry-instrumentation-alephalpha==0.62.4"]
bedrock=["opentelemetry-instrumentation-bedrock==0.62.4"]
chromadb=["opentelemetry-instrumentation-chromadb==0.62.4"]
# no-op: cohere is instrumented natively now; kept so `lmnr[cohere]` still resolves
cohere=[]
crewai=["opentelemetry-instrumentation-crewai==0.62.4"]
haystack=["opentelemetry-instrumentation-haystack==0.62.4"]
lancedb=["opentelemetry-instrumentation-lancedb==0.62.4"]
# LangChain is instrumented natively; kept so `lmnr[langchain]` still resolves
langchain=[]
llamaindex=["opentelemetry-instrumentation-llamaindex==0.62.4"]
marqo=["opentelemetry-instrumentation-marqo==0.62.4"]
# no-op: mcp is instrumented natively now; kept so `lmnr[mcp]` still resolves
mcp=[]
mistralai=["opentelemetry-instrumentation-mistralai==0.62.4"]
ollama=["opentelemetry-instrumentation-ollama==0.62.4"]
qdrant=["opentelemetry-instrumentation-qdrant==0.62.4"]
replicate=["opentelemetry-instrumentation-replicate==0.62.4"]
sagemaker=["opentelemetry-instrumentation-sagemaker==0.62.4"]
together=["opentelemetry-instrumentation-together==0.62.4"]
transformers=["opentelemetry-instrumentation-transformers==0.62.4"]
# no-op: vertexai is instrumented natively now; kept so `lmnr[vertexai]` still resolves
vertexai=[]
watsonx=["opentelemetry-instrumentation-watsonx==0.62.4"]
weaviate=["opentelemetry-instrumentation-weaviate==0.62.4"]
# `all` is the group added for convenience, if you want to install all
# the instrumentations.
# we suggest using package-manager-specific commands instead,
# like `uv add lmnr --all-extras`
all = [
  "opentelemetry-instrumentation-alephalpha==0.62.4",
  "opentelemetry-instrumentation-bedrock==0.62.4",
  "opentelemetry-instrumentation-chromadb==0.62.4",
  "opentelemetry-instrumentation-crewai==0.62.4",
  "opentelemetry-instrumentation-haystack==0.62.4",
  "opentelemetry-instrumentation-lancedb==0.62.4",
  "opentelemetry-instrumentation-llamaindex==0.62.4",
  "opentelemetry-instrumentation-marqo==0.62.4",
  "opentelemetry-instrumentation-mistralai==0.62.4",
  "opentelemetry-instrumentation-ollama==0.62.4",
  "opentelemetry-instrumentation-qdrant==0.62.4",
  "opentelemetry-instrumentation-replicate==0.62.4",
  "opentelemetry-instrumentation-sagemaker==0.62.4",
  "opentelemetry-instrumentation-together==0.62.4",
  "opentelemetry-instrumentation-transformers==0.62.4",
  "opentelemetry-instrumentation-watsonx==0.62.4",
  "opentelemetry-instrumentation-weaviate==0.62.4"
]

[dependency-groups]
dev = [
  "anthropic[bedrock]==2.3.0",
  "agent-framework-core==1.20.0",
  "agent-framework-openai==1.15.0",
  "basedpyright==1.40.2",
  "cdp-use==1.4.5",
  "claude-agent-sdk==0.2.168",
  "cohere==7.3.0",
  "google-adk==2.11.0",
  "daytona==0.225.0",
  "google-cloud-aiplatform==2.6.0",
  "google-genai==2.19.0",
  "groq==1.1.2",
  "kernel==0.44.0",
  "langchain==1.4.4",
  "langchain-core==1.6.9",
  "langchain-openai==1.7.0",
  "langfuse==4.8.1",
  "langgraph==1.2.14",
  "litellm==1.103.4",
  "mcp==2.3.0",
  "openai==2.54.0",
  "openai-agents==0.20.0",
  "openrouter==1.3.73",
  "patchright==1.58.2",
  "playwright==1.58.0",
  "pydantic-ai-slim==2.55.0",
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "pytest-recording==0.13.4",
  "pytest-sugar==1.1.1",
  "ruff==0.17.1",
  "skyvern==1.0.48",
  "temporalio==1.31.0",
  "typesafe-sdk==0.7.0",
  "vcrpy==8.3.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Agent docs live next to the code they describe; keep them out of the distributions.
source-exclude = ["**/AGENTS.md", "**/CLAUDE.md"]
wheel-exclude = ["**/AGENTS.md", "**/CLAUDE.md"]

[tool.uv.workspace]
members = ["examples/fastapi-app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# BLE001 (flake8-blind-except): the codebase intentionally catches bare
# `Exception` at instrumentation/SDK boundaries so a provider or downstream
# failure never crashes the host application.
ignore = ["BLE001"]
