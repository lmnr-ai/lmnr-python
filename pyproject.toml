# Laminar Python

# If you are looking for information about possible extras installations,
# i.e. what you can pass into `pip install 'lmnr[extra1,extra2]'`, please see the
# `[project.optional-dependencies]` section below.

[project]
name = "lmnr"
version = "0.9.0"
description = "Python SDK for Laminar"
authors = [
  { name = "lmnr.ai", email = "founders@lmnr.ai" }
]
readme = "README.md"
requires-python = ">=3.11,<4"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  # grpcio used to have some issues with improper shutdown.
  # Fixed in opentelemetry-exporter-otlp-proto-grpc >=1.31.0.
  # Fixed in grpc >= 1.80.0. Remaining related issue to track
  # https://github.com/grpc/grpc/issues/41672
  "blake3 (>=1.0.0,<2.0.0)",
  "grpcio>=1",
  "httpx (>=0.24.0,<1.0.0)",
  "lmnr-claude-code-proxy>=0.2.0",
  "opentelemetry-api (>=1.39.0, <2.0.0)",
  "opentelemetry-sdk (>=1.39.0, <2.0.0)",
  "opentelemetry-exporter-otlp-proto-http (>=1.39.0, <2.0.0)",
  "opentelemetry-exporter-otlp-proto-grpc (>=1.39.0, <2.0.0)",
  "opentelemetry-instrumentation (>=0.54b0, <1.0.0)",
  "opentelemetry-instrumentation-threading (>=0.54b0, <1.0.0)",
  "opentelemetry-semantic-conventions (>=0.62b1, <1.0.0)",
  "orjson (>=3.0.0,<4.0.0)",
  "packaging (>=22.0,<27.0)",
  "pydantic (>=2.0.3,<3.0.0)",
  "python-dotenv (>=1.0,<2.0)",
  "tqdm (>=4.0,<5.0)",
  "tenacity (>=8.0,<10.0)",
  "wrapt (>=1.14,<3.0.0)",
]
# poetry would auto-generate these based on requires-python, but other build
# systems don't, so we need to specify them manually.
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]

[project.scripts]
lmnr = "lmnr.cli:cli"

[project.entry-points."harbor.plugins"]
laminar = "lmnr.integrations.harbor:LaminarPlugin"

[dependency-groups]
dev = [
  "anthropic[bedrock]==2.3.0",
  "agent-framework-core==1.20.0",
  "agent-framework-openai==1.15.0",
  "basedpyright==1.40.2",
  "cdp-use==1.4.5",
  "claude-agent-sdk==0.2.168",
  "cohere==7.3.0",
  "daytona==0.225.0",
  "google-adk==2.13.0",
  "google-cloud-aiplatform==2.6.0",
  "google-genai==2.33.0",
  "groq==1.1.2",
  "jsonschema==4.26.0",
  "kernel==0.44.0",
  "langchain==1.4.4",
  "langchain-core==1.6.9",
  "langchain-openai==1.7.0",
  "langfuse==4.15.0",
  "langgraph==1.2.14",
  "litellm==1.103.4",
  "mcp==2.3.0",
  "openai==2.54.0",
  "openai-agents==0.20.0",
  "openrouter==1.3.73",
  "patchright==1.58.2",
  "playwright==1.58.0",
  "pydantic-ai-slim==2.55.0",
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "pytest-recording==0.13.4",
  "pytest-sugar==1.1.1",
  "ruff==0.17.1",
  "skyvern==1.0.48",
  "temporalio==1.31.0",
  "typesafe-sdk==0.7.0",
  "vcrpy==8.3.0",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Agent docs live next to the code they describe; keep them out of the distributions.
source-exclude = ["**/AGENTS.md", "**/CLAUDE.md"]
wheel-exclude = ["**/AGENTS.md", "**/CLAUDE.md"]

[tool.uv.workspace]
members = ["examples/fastapi-app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# BLE001 (flake8-blind-except): the codebase intentionally catches bare
# `Exception` at instrumentation/SDK boundaries so a provider or downstream
# failure never crashes the host application.
ignore = ["BLE001"]
